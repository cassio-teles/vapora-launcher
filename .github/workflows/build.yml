name: Build Vapora

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download aria2 and CA certificates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          $zip = "$env:RUNNER_TEMP/aria2.zip"
          Invoke-WebRequest "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" -OutFile $zip
          Expand-Archive $zip "$env:RUNNER_TEMP/aria2" -Force
          $aria = Get-ChildItem "$env:RUNNER_TEMP/aria2" -Filter aria2c.exe -Recurse | Select-Object -First 1
          if (-not $aria) { throw "aria2c.exe not found in official aria2 release archive" }
          Copy-Item $aria.FullName src-tauri/resources/aria2c.exe
          Invoke-WebRequest "https://curl.se/ca/cacert.pem" -OutFile src-tauri/resources/ca-certificates.crt

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Vapora-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
